---
# Deletes everything labelled kmetal-validate/run-id=<_cl_rid>, in an order that lets every
# controller finish its work:
#   1. tenant Clusters (their machines, VMs and control planes go with them), waited for
#   2. EipClaims, SubnetClaims, VpcClaims
#   3. namespaces (test, environments, the owners' namespace if the run created it)
#   4. Capsule Tenants, then the owner ServiceAccounts
# Used at the end of kmetal.yml and by cleanup.yml.

- name: cleanup | delete the tenant Clusters of run {{ _cl_rid }}
  ansible.builtin.command: kubectl delete clusters.cluster.x-k8s.io -A -l {{ kmv_label_key }}={{ _cl_rid }} --wait=false
  register: _cl_clusters
  changed_when: "'deleted' in _cl_clusters.stdout"
  failed_when: false

- name: cleanup | wait until the Clusters are gone (up to 20m)
  ansible.builtin.command: kubectl get clusters.cluster.x-k8s.io -A -l {{ kmv_label_key }}={{ _cl_rid }} -o name
  register: _cl_left
  until: _cl_left.rc != 0 or _cl_left.stdout | length == 0
  retries: 120
  delay: 10
  changed_when: false
  failed_when: false
  when: "'deleted' in _cl_clusters.stdout"

- name: cleanup | delete claims, namespaces, Tenants and ServiceAccounts
  ansible.builtin.command: "{{ item }}"
  loop:
    - kubectl delete eipclaims.network.kmetal.io -A -l {{ kmv_label_key }}={{ _cl_rid }} --wait=true --timeout=300s
    - kubectl delete subnetclaims.network.kmetal.io -A -l {{ kmv_label_key }}={{ _cl_rid }} --wait=true --timeout=300s
    - kubectl delete vpcclaims.network.kmetal.io -A -l {{ kmv_label_key }}={{ _cl_rid }} --wait=true --timeout=300s
    - kubectl delete namespaces -l {{ kmv_label_key }}={{ _cl_rid }} --wait=true --timeout=600s
    - kubectl delete tenants.capsule.clastix.io -l {{ kmv_label_key }}={{ _cl_rid }} --wait=true --timeout=300s
    - kubectl delete serviceaccounts -A -l {{ kmv_label_key }}={{ _cl_rid }}
  loop_control:
    label: "{{ item.split(' ')[2] }}"
  register: _cl_del
  changed_when: "'deleted' in _cl_del.stdout"
  failed_when: false

- name: cleanup | what is left
  ansible.builtin.command: kubectl get clusters.cluster.x-k8s.io,namespaces,tenants.capsule.clastix.io -A -l {{ kmv_label_key }}={{ _cl_rid }} -o name
  register: _cl_final
  changed_when: false
  failed_when: false

- name: cleanup | verdicts
  kmv_record:
    group: cleanup
    verdicts: >-
      {%- set left = _cl_final.stdout_lines | default([]) -%}
      {%- if _cl_final.rc != 0 -%}
      {{ [{'level': 'WARN', 'msg': 'cannot list what is left of run ' ~ _cl_rid ~ ': ' ~ _cl_final.stderr | truncate(200)}] }}
      {%- elif left -%}
      {{ [{'level': 'WARN', 'msg': 'still present after cleanup of run ' ~ _cl_rid ~ ': ' ~ left | join(' ')
                                   ~ ' (rerun: ansible-playbook -i <inventory> cleanup.yml -e kmv_run_id=' ~ _cl_rid ~ ')'}] }}
      {%- else -%}
      {{ [{'level': 'PASS', 'msg': 'nothing labelled ' ~ kmv_label_key ~ '=' ~ _cl_rid ~ ' is left'}] }}
      {%- endif -%}
