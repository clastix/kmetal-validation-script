---
# connectivity: SSH + sudo to every node, and collection of the facts the later groups
# evaluate. Runs on every node in parallel. A node that fails here records a FAIL and is
# dropped from the rest of the play.

- name: connectivity | Connect over SSH, become root with sudo -n, gather CPU, memory, disk and OS facts
  ansible.builtin.setup:
    gather_subset: [min, hardware]
    gather_timeout: 30
  ignore_unreachable: true
  ignore_errors: true
  register: _uc_setup

- name: connectivity | node not reachable
  when: (_uc_setup.unreachable | default(false)) or (_uc_setup.failed | default(false))
  block:
    - name: connectivity | verdict (unreachable)
      kmv_record:
        group: connectivity
        verdicts:
          - level: FAIL
            msg: >-
              {{ inventory_hostname }} ({{ ansible_host }}): cannot run sudo -n over SSH as
              {{ ansible_user | default('?') }}: {{ (_uc_setup.msg | default('')) | truncate(160) }}

    - name: connectivity | drop the node from the play
      ansible.builtin.meta: end_host

- name: connectivity | Read the links and addresses (ip -d -j link, ip -j addr)
  ansible.builtin.command: "{{ item }}"
  loop:
    - ip -d -j link show
    - ip -j addr show
  register: _uc_ip
  changed_when: false

- name: connectivity | Read sysctls, installed tools, kernel modules and link speeds  # noqa: risky-shell-pipe  (best-effort probes; every line reports its own result)
  ansible.builtin.shell: |
    has() { command -v "$1" >/dev/null 2>&1 && echo 1 || echo 0; }
    echo "inotify=$(sysctl -n fs.inotify.max_user_instances 2>/dev/null)"
    echo "ip_forward=$(sysctl -n net.ipv4.ip_forward 2>/dev/null)"
    echo "br_netfilter=$([ -e /proc/sys/net/bridge/bridge-nf-call-iptables ] && echo 1 || echo 0)"
    for t in conntrack socat curl ping netplan; do echo "$t=$(has $t)"; done
    echo "ntp=$(timedatectl show -p NTPSynchronized --value 2>/dev/null)"
    echo "kvm=$([ -c /dev/kvm ] && echo 1 || echo 0)"
    echo "kvm_mod=$(grep -cE '^kvm_(intel|amd) ' /proc/modules)"
    for m in geneve vxlan openvswitch; do
      if grep -q "^$m " /proc/modules || modprobe -n "$m" 2>/dev/null; then echo "mod_$m=1"; else echo "mod_$m=0"; fi
    done
    for d in /sys/class/net/*; do echo "speed_${d##*/}=$(cat "$d/speed" 2>/dev/null)"; done
    exit 0
  args:
    executable: /bin/bash
  register: _uc_misc
  changed_when: false

- name: connectivity | Read the netplan configuration (netplan get)
  ansible.builtin.command: netplan get
  register: _uc_netplan
  changed_when: false
  failed_when: false

- name: connectivity | store the node facts
  ansible.builtin.set_fact:
    kmv_n:
      links: "{{ _uc_ip.results[0].stdout | from_json }}"
      addrs: "{{ _uc_ip.results[1].stdout | from_json }}"
      misc: "{{ dict(_uc_misc.stdout_lines | select('search', '=') | map('split', '=', 1)) }}"
      netplan: "{{ _uc_netplan.stdout | default('') if (_uc_netplan.rc | default(1)) == 0 else '' }}"

- name: connectivity | verdicts
  kmv_record:
    group: connectivity
    verdicts: >-
      {%- set f = ansible_facts -%}
      {%- set v = [{'level': 'PASS', 'msg': inventory_hostname ~ ': SSH + sudo OK (' ~ f.distribution | default('?') ~ ' '
                    ~ f.distribution_version | default('') ~ ', kernel ' ~ f.kernel | default('?') ~ ')'}] -%}
      {%- if f.hostname | default(inventory_hostname) != inventory_hostname -%}
      {%-   set _ = v.append({'level': 'INFO', 'msg': inventory_hostname ~ ": hostname is '" ~ f.hostname ~ "'"}) -%}
      {%- endif -%}
      {{ v }}
