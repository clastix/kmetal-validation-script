---
# The owner of _src's tenant is denied every probed action on _dst's tenant: its pods,
# secrets and cluster kubeconfig, its Clusters and network claims, its namespace and its
# Tenant (kubectl auth can-i, impersonating the owner).

- name: rbac | {{ _src }} -> {{ _dst }} can-i probes
  ansible.builtin.command:
    argv: >-
      {{ ['kubectl', 'auth', 'can-i'] + item.split(' ')
         + ['--as=system:serviceaccount:' ~ _e2e_sa_ns ~ ':' ~ _e2e_envs[_src].tenant,
            '--as-group=' ~ _e2e_group, '--as-group=system:authenticated'] }}
  loop:
    - "get pods -n {{ _e2e_envs[_src].ns }}"
    - "get pods -n {{ _e2e_envs[_dst].ns }}"
    - "create pods -n {{ _e2e_envs[_dst].ns }}"
    - "get secrets -n {{ _e2e_envs[_dst].ns }}"
    - "get secrets/{{ _e2e_envs[_dst].cluster }}-kubeconfig -n {{ _e2e_envs[_dst].ns }}"
    - "get clusters.cluster.x-k8s.io -n {{ _e2e_envs[_dst].ns }}"
    - "create vpcclaims.network.kmetal.io -n {{ _e2e_envs[_dst].ns }}"
    - "create subnetclaims.network.kmetal.io -n {{ _e2e_envs[_dst].ns }}"
    - "create eipclaims.network.kmetal.io -n {{ _e2e_envs[_dst].ns }}"
    - "delete namespaces/{{ _e2e_envs[_dst].ns }}"
    - "update tenants.capsule.clastix.io/{{ _e2e_envs[_dst].tenant }}"
  register: _rb
  changed_when: false
  failed_when: false

- name: rbac | {{ _src }} -> {{ _dst }} verdicts
  kmv_record:
    group: e2e-tenants
    verdicts: >-
      {%- set st, dt, dst = _e2e_envs[_src].tenant, _e2e_envs[_dst].tenant, _e2e_envs[_dst].ns -%}
      {%- set v = [] -%}
      {%- if _rb.results[0].stdout | default('') != 'yes' -%}
      {%-   set _ = v.append({'level': 'WARN', 'msg': 'the owner of ' ~ st ~ ' cannot read pods in its own environment ' ~ _e2e_envs[_src].ns ~ '; the denials below prove little'}) -%}
      {%- endif -%}
      {%- set allowed = _rb.results[1:] | selectattr('stdout', 'eq', 'yes') | map(attribute='item') | list -%}
      {%- if allowed -%}
      {%-   set _ = v.append({'level': 'FAIL', 'msg': 'the owner of ' ~ st ~ ' is allowed on tenant ' ~ dt ~ ': ' ~ allowed | kmv_joinc}) -%}
      {%- else -%}
      {%-   set _ = v.append({'level': 'PASS', 'msg': 'the owner of ' ~ st ~ ' is denied all ' ~ (_rb.results | length - 1) ~ ' probed actions on tenant ' ~ dt
                              ~ ' (environment ' ~ dst ~ ', its claims, kubeconfig, Tenant)'}) -%}
      {%- endif -%}
      {{ v }}
