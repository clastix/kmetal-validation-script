---
# Environment `key`: namespace _e2e_envs[key].ns created by the owner of its tenant (Capsule
# must assign it), with VpcClaim main (externalAccess) and SubnetClaim primary on
# kmv_e2e_subnet_cidr. Sets _e2e_ok[key].

- name: env {{ key }} | create the namespace as the owner of {{ _e2e_envs[key].tenant }}
  ansible.builtin.command:
    argv:
      - kubectl
      - create
      - namespace
      - "{{ _e2e_envs[key].ns }}"
      - "--as=system:serviceaccount:{{ _e2e_sa_ns }}:{{ _e2e_envs[key].tenant }}"
      - "--as-group={{ _e2e_group }}"
      - --as-group=system:authenticated
  register: _env_create
  changed_when: _env_create.rc == 0
  failed_when: false

- name: env {{ key }} | not created
  when: _env_create.rc != 0
  block:
    - name: env {{ key }} | verdict
      kmv_record:
        group: "{{ _e2e_envs[key].group }}"
        verdicts:
          - level: FAIL
            msg: "owner of {{ _e2e_envs[key].tenant }} cannot create environment {{ _e2e_envs[key].ns }}: {{ _env_create.stderr | truncate(200) }}"

    - name: env {{ key }} | failed
      ansible.builtin.set_fact:
        _e2e_ok: "{{ _e2e_ok | combine({key: false}) }}"

- name: env {{ key }} | claims
  when: _env_create.rc == 0
  block:
    - name: env {{ key }} | label the namespace with the run ID, read its tenant
      ansible.builtin.shell: |
        kubectl label namespace {{ _e2e_envs[key].ns }} {{ kmv_label_key }}={{ kmv_rid }} >/dev/null
        kubectl get namespace {{ _e2e_envs[key].ns }} -o jsonpath='{.metadata.labels.capsule\.clastix\.io/tenant}'
      register: _env_tenant
      changed_when: true
      failed_when: false

    - name: env {{ key }} | can the owner create SubnetClaims
      ansible.builtin.command:
        argv:
          - kubectl
          - auth
          - can-i
          - create
          - subnetclaims.network.kmetal.io
          - -n
          - "{{ _e2e_envs[key].ns }}"
          - "--as=system:serviceaccount:{{ _e2e_sa_ns }}:{{ _e2e_envs[key].tenant }}"
          - "--as-group={{ _e2e_group }}"
          - --as-group=system:authenticated
      register: _env_cani
      changed_when: false
      failed_when: false

    - name: env {{ key }} | VpcClaim main and SubnetClaim primary on {{ kmv_e2e_subnet_cidr }}
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: List
          items:
            - apiVersion: network.kmetal.io/v1alpha1
              kind: VpcClaim
              metadata: {name: main, namespace: "{{ _e2e_envs[key].ns }}", labels: "{{ {kmv_label_key: kmv_rid} }}"}
              spec: {externalAccess: true}
            - apiVersion: network.kmetal.io/v1alpha1
              kind: SubnetClaim
              metadata: {name: primary, namespace: "{{ _e2e_envs[key].ns }}", labels: "{{ {kmv_label_key: kmv_rid} }}"}
              spec:
                cidrBlock: "{{ kmv_e2e_subnet_cidr }}"
                gateway: "{{ kmv_e2e_subnet_cidr | kmv_host(1) }}"
                protocol: IPv4
                excludeIps: ["{{ kmv_e2e_subnet_cidr | kmv_host(1) }}"]
                attachment: {managed: true}
                enableSnatRule: true
      register: _env_claims
      ignore_errors: true

    - name: env {{ key }} | VpcClaim main
      ansible.builtin.include_tasks:
        file: wait_ready.yml
        apply:
          tags: [e2e, e2e-tenants]
      vars:
        _wr_kind: vpcclaims.network.kmetal.io
        _wr_name: main
        _wr_ns: "{{ _e2e_envs[key].ns }}"
      when: not (_env_claims.failed | default(false))

    - name: env {{ key }} | remember the VpcClaim
      ansible.builtin.set_fact:
        _env_vpc_ok: "{{ _wr_ok | default(false) and not (_env_claims.failed | default(false)) }}"
        _env_vpc_status: "{{ _wr_status | default({}) }}"

    - name: env {{ key }} | SubnetClaim primary
      ansible.builtin.include_tasks:
        file: wait_ready.yml
        apply:
          tags: [e2e, e2e-tenants]
      vars:
        _wr_kind: subnetclaims.network.kmetal.io
        _wr_name: primary
        _wr_ns: "{{ _e2e_envs[key].ns }}"
      when: _env_vpc_ok

    - name: env {{ key }} | router-port EipClaim external
      ansible.builtin.command: kubectl get eipclaims.network.kmetal.io external -n {{ _e2e_envs[key].ns }}
      register: _env_eip
      changed_when: false
      failed_when: false
      when: _env_vpc_ok and _wr_ok

    - name: env {{ key }} | verdicts
      kmv_record:
        group: "{{ _e2e_envs[key].group }}"
        verdicts: >-
          {%- set e = _e2e_envs[key] -%}
          {%- set v = [] -%}
          {%- set got = _env_tenant.stdout | default('') -%}
          {%- set _ = v.append({'level': 'PASS', 'msg': 'environment ' ~ e.ns ~ ' created by the owner of ' ~ e.tenant ~ ', assigned to ' ~ e.tenant} if got == e.tenant
                              else {'level': 'FAIL', 'msg': 'environment ' ~ e.ns ~ " has capsule.clastix.io/tenant='" ~ got ~ "', expected " ~ e.tenant}) -%}
          {%- if _env_cani.stdout | default('') != 'yes' -%}
          {%-   set _ = v.append({'level': 'INFO', 'msg': 'the owner of ' ~ e.tenant ~ ' cannot create SubnetClaims in ' ~ e.ns ~ '; the claims are applied as admin'}) -%}
          {%- endif -%}
          {%- if _env_claims.failed | default(false) -%}
          {%-   set _ = v.append({'level': 'FAIL', 'msg': 'cannot create VpcClaim/SubnetClaim in ' ~ e.ns ~ ': ' ~ _env_claims.msg | default('') | truncate(200)}) -%}
          {%- elif not _env_vpc_ok -%}
          {%-   set _ = v.append({'level': 'FAIL', 'msg': e.ns ~ ': vpcclaim main not Ready in 300s: ' ~ _env_vpc_status | to_json | truncate(300)}) -%}
          {%- else -%}
          {%-   set _ = v.append({'level': 'PASS', 'msg': e.ns ~ ': vpcclaim main Ready'}) -%}
          {%-   if not _wr_ok -%}
          {%-     set _ = v.append({'level': 'FAIL', 'msg': e.ns ~ ': subnetclaim primary not Ready in 300s: ' ~ _wr_status | to_json | truncate(300)}) -%}
          {%-   else -%}
          {%-     set _ = v.append({'level': 'PASS', 'msg': e.ns ~ ': subnetclaim primary Ready'}) -%}
          {%-     set v4 = _env_eip.stdout | default('') | kmv_table_col('V4') -%}
          {%-     set _ = v.append({'level': 'PASS', 'msg': e.ns ~ ': router-port EipClaim external on ' ~ v4} if v4
                                  else {'level': 'WARN', 'msg': e.ns ~ ': no EipClaim external with an address'}) -%}
          {%-   endif -%}
          {%- endif -%}
          {{ v }}

    - name: env {{ key }} | result
      ansible.builtin.set_fact:
        _e2e_ok: "{{ _e2e_ok | combine({key: _env_vpc_ok and (_wr_ok | default(false))}) }}"
