---
# Waits until an object is ready: Ready condition True, .status.ready true, or a READY
# printer column of True. Inputs: _wr_kind, _wr_name, _wr_ns, _wr_retries (5 s apart).
# Sets _wr_ok and _wr_status (the object's .status, for diagnostics).

- name: wait | {{ _wr_kind }} {{ _wr_ns }}/{{ _wr_name }} ready
  ansible.builtin.shell: |
    kubectl get {{ _wr_kind }} {{ _wr_name | quote }} -n {{ _wr_ns | quote }} -o json
    echo '---'
    kubectl get {{ _wr_kind }} {{ _wr_name | quote }} -n {{ _wr_ns | quote }}
  register: _wr
  until: >-
    _wr.rc == 0 and ((((_wr.stdout.split('\n---\n') | first) | from_json) | kmv_ready)
    or ((_wr.stdout.split('\n---\n') | last) | kmv_table_col('READY')) == 'True')
  retries: "{{ _wr_retries | default(60) }}"
  delay: 5
  changed_when: false
  failed_when: false

- name: wait | result
  ansible.builtin.set_fact:
    _wr_ok: >-
      {{ _wr.rc == 0 and ((((_wr.stdout.split('\n---\n') | first) | from_json) | kmv_ready)
         or ((_wr.stdout.split('\n---\n') | last) | kmv_table_col('READY')) == 'True') }}
    _wr_status: "{{ (((_wr.stdout | default('{}')).split('\n---\n') | first) | from_json).status | default({}) if _wr.rc == 0 else {} }}"
