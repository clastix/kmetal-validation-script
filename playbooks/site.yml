---
# Full acceptance of a site: under cluster checks, then platform checks and e2e tests.
#
#   ansible-playbook -i inventory/<site> playbooks/site.yml
#
# The under cluster summary does not stop the run; the final summary covers both parts.

- name: Under cluster
  ansible.builtin.import_playbook: undercluster.yml
  vars:
    kmv_summary_fail: false

- name: Platform
  ansible.builtin.import_playbook: kmetal.yml
