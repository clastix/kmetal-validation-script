---
# Example site: 1 control plane + 2 workers. Addresses, VLANs and CIDRs are random examples;
# replace every one of them. Reference: docs/configuration.md
#
#   ansible-playbook -i inventory/example check-env.yml
all:
  vars:
    # SSH user on the nodes; it needs passwordless sudo.
    ansible_user: clastix
    # Through a jump host:
    # ansible_ssh_common_args: "-J jump@bastion.example"
  children:
    kmetal_nodes:
      children:
        control_plane:
          hosts:
            kmetal-controller:
              # Control planes carry no overlay address: Kube-OVN's tunnel runs on the
              # network nodes only.
              kmv_addresses: {mgmt: 172.22.104.11, tenant: 172.22.108.11}
        workers:
          hosts:
            kmetal-worker-01:
              kmv_addresses: {mgmt: 172.22.104.12, tenant: 172.22.108.12, overlay: 172.22.105.12}
            kmetal-worker-02:
              kmv_addresses: {mgmt: 172.22.104.13, tenant: 172.22.108.13, overlay: 172.22.105.13}
            kmetal-worker-03:
              kmv_addresses: {mgmt: 172.22.104.14, tenant: 172.22.108.14, overlay: 172.22.105.14}
              
              
