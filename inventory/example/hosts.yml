---
# Example site: 1 control plane + 2 workers. Addresses, VLANs and CIDRs are random examples;
# replace every one of them. Reference: docs/configuration.md
#
#   ansible-playbook -i inventory/example check-env.yml
all:
  vars:
    # SSH user on the nodes; it needs passwordless sudo.
    ansible_user: clastix
    # Through a jump host:
    # ansible_ssh_common_args: "-J jump@bastion.example"
  children:
    kmetal_nodes:
      children:
        control_plane:
          hosts:
            kmetal-controller:
              # Control planes carry no overlay address: Kube-OVN's tunnel runs on the
              # network nodes only.
              kmv_addresses: {mgmt: 10.55.227.60, tenant: 10.55.91.60}
        workers:
          hosts:
            kmetal-worker-01:
              kmv_addresses: {mgmt: 10.55.227.71, tenant: 10.55.91.71, overlay: 10.55.172.71}
            kmetal-worker-02:
              kmv_addresses: {mgmt: 10.55.227.84, tenant: 10.55.91.84, overlay: 10.55.172.84}
