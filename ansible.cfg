# Run every playbook from this directory: Ansible reads ansible.cfg from the current directory.
[defaults]
roles_path = ./roles
collections_path = ./collections
library = ./library
action_plugins = ./action_plugins
filter_plugins = ./filter_plugins
test_plugins = ./test_plugins
# Readable output: results as YAML. Skipped tasks stay visible so every verdict prints
# under its own task banner.
callback_result_format = yaml
display_skipped_hosts = true
# Facts are read as ansible_facts.<name> only (the future Ansible default).
inject_facts_as_vars = false
interpreter_python = auto_silent
localhost_warning = false
forks = 20

[privilege_escalation]
# Root on the nodes through passwordless sudo (sudo -n).
become_method = sudo

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new
pipelining = True
